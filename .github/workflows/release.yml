name: Create release

on:
  push:
    tags:
      - v*

env:
  TAG_NAME: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate changelog
        run: |
          CURRENT_TAG="${{ env.TAG_NAME }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          echo "## Jellyfin Uploader ${CURRENT_TAG}

          ${CHANGELOG}" > /tmp/release_notes.md

      - name: Build signed APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: ./gradlew clean assembleRelease

      - name: Rename APK
        run: |
          find app/build/outputs/apk/release -name '*.apk' -exec \
            cp {} app/build/outputs/apk/JellyfinUploader-${{ env.TAG_NAME }}.apk \;

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            --latest \
            --title "Jellyfin Uploader ${{ env.TAG_NAME }}" \
            --notes-file /tmp/release_notes.md \
            app/build/outputs/apk/JellyfinUploader-${{ env.TAG_NAME }}.apk
