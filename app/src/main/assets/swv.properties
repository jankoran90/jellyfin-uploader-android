# ===================================================================
#      Jellyfin Uploader Android - Configuration
# ===================================================================

# ===========================================
# ANDROID BUILD CONFIGURATION
# ===========================================
build.application.id=cz.jankoran.jellyfinuploader
build.namespace.id=mgks.os.swv
build.version.code=1
build.version.name=1.0.0

build.sdk.compile=36
build.sdk.min=24

# ===========================================
# APP CONTEXT CONFIGURATION
# ===========================================
debug.mode=false

# --- URL Configuration ---
app.url=https://upload.jankoran.cz
offline.url=file:///android_asset/web/offline.html
search.url=https://www.google.com/search?q=
external.url.exception.list=upload.jankoran.cz,jankoran.cz

# --- Feature Flags ---
feature.uploads=true
feature.camera.uploads=true
feature.multiple.uploads=true
feature.custom.css=false
feature.copy.paste=true
feature.pull.refresh=true
feature.progress.bar=true
feature.zoom=false
feature.save.form=true
feature.open.external.urls=false
feature.chrome.tabs=false
behavior.back.exits=false
feature.exit.dialog=true

# --- Permissions ---
permissions.on.launch=

# --- Security ---
security.verify.ssl=true
security.block.screenshots=false
security.accept.thirdparty.cookies=true

# --- UI & Theme ---
ui.orientation=0
ui.layout=0
ui.drawer.header=false
ui.splash.extend=true

# --- User Agent ---
agent.postfix.enabled=true
agent.postfix.value=JellyfinUploaderAndroid

agent.override.enabled=false
agent.override.value=

# --- Analytics ---
analytics.gtag.id=

# --- Plugins ---
plugins.enabled=DialogPlugin,ToastPlugin
plugins.playground.enabled=false

# RatingPlugin (disabled)
rating.install.days=999
rating.launch.times=999
rating.remind.interval=999

# BiometricPlugin (disabled)
biometric.trigger.launch=false
